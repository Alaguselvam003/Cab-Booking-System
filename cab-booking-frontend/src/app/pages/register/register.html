<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="auth-container d-flex justify-content-center align-items-center py-5" style="background: radial-gradient(circle, #f8fafc 0%, #e2e8f0 100%);">
    <div class="card auth-card shadow-sm p-4 col-12 col-sm-10 col-md-8 col-lg-6" style="border-radius: 16px; border: none; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05) !important; animation: slideUp 0.6s ease-out;">
      <div class="text-center mb-4">
        <h2 class="text-primary font-weight-bold" style="letter-spacing: -0.5px;">Create Account</h2>
        <p class="text-muted">Register to book a cab or drive with us</p>
      </div>

      @if (message) {
        <div class="alert alert-info text-center py-2" role="alert" style="border-radius: 8px; border: none; font-weight: 500;">
          {{ message }}
        </div>
      }

      <form (ngSubmit)="register()">
        
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-primary"><i class="bi bi-person"></i></span>
            <input type="text" name="name" [(ngModel)]="registerData.name" class="form-control" placeholder="Enter username" required style="border-left: none;">
          </div>
        </div>
        
        <div class="mb-3">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-primary"><i class="bi bi-envelope"></i></span>
            <input type="email" name="email" [(ngModel)]="registerData.email" class="form-control" placeholder="Enter email" required style="border-left: none;">
          </div>
        </div>
       
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-primary"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" [(ngModel)]="registerData.password" class="form-control" placeholder="Min 6 chars & 1 special char" required style="border-left: none;">
          </div>
        </div>
        
        <div class="mb-3">
          <label class="form-label" for="phone">Phone Number</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-primary"><i class="bi bi-phone"></i></span>
            <input type="text" name="phone" [(ngModel)]="registerData.phone" class="form-control" placeholder="Enter 10-digit phone number" minlength="10" maxlength="10" required style="border-left: none;">
          </div>
        </div>
        
        <div class="mb-4">
          <label class="form-label" for="role">Register As</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-primary"><i class="bi bi-briefcase"></i></span>
            <select name="role" id="role" [(ngModel)]="registerData.role" class="form-select" style="border-left: none; cursor: pointer;">
              <option value="user">Passenger</option>
              <option value="driver">Driver</option>
            </select>
          </div>
        </div>

        @if (registerData.role === 'driver') {
          <div class="driver-info p-3 mb-4 rounded border bg-light" style="border-color: #cfe2ff !important; animation: fadeIn 0.4s ease-in-out;">
            <h5 class="mb-3 text-primary"><i class="bi bi-car-front-fill me-2"></i>Driver & Vehicle Info</h5>
            
            <div class="mb-3">
              <label class="form-label" for="licensenumber">License Number</label>
              <input type="number" name="licensenumber" [(ngModel)]="registerData.licensenumber" class="form-control" placeholder="Enter license number" required>
            </div>

            <div class="mb-3">
              <label class="form-label" for="vehicleType">Vehicle Type</label>
              <select name="vehicleType" id="vehicleType" [(ngModel)]="registerData.vehicleType" class="form-select" style="cursor: pointer;">
                <option value="Sedan">Sedan</option>
                <option value="SUV">SUV</option>
                <option value="Hatchback">Hatchback</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label" for="numberplate">Vehicle Plate Number</label>
              <input type="text" name="numberplate" [(ngModel)]="registerData.numberplate" class="form-control" placeholder="e.g. TN01AB1234" required>
            </div>

            <div class="mb-3">
              <label class="form-label" for="capacity">Vehicle Capacity (Seats)</label>
              <input type="number" name="capacity" [(ngModel)]="registerData.capacity" class="form-control" placeholder="e.g. 4" required>
            </div>
          </div>
        }

        <button type="submit" class="btn btn-primary w-100 py-2 mb-3 shadow-sm" style="border-radius: 8px; font-size: 16px; letter-spacing: 0.5px;">Register Account</button>
        
        <div class="text-center text-muted">
          <p class="mb-0">Already have an account? <a routerLink="/login" class="text-primary text-decoration-none fw-bold" style="transition: color 0.2s;">Login here</a></p>
        </div>
      </form>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="auth-wrapper d-flex align-items-center justify-content-center py-5">
    <div class="container px-3">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-11 col-md-9 col-lg-7 col-xl-6">
          
          <div class="card swift-card p-4 p-sm-5 animate-fade-in-up">
            
            <div class="text-center mb-4">
              <div class="auth-icon-bubble mx-auto mb-3">
                <i class="bi bi-person-plus-fill text-yellow fs-2"></i>
              </div>
              <h3 class="fw-bold text-navy mb-1">Create an Account</h3>
              <p class="text-secondary small mb-0">Join SwiftCab as a passenger or registered driver</p>
            </div>

            @if (message) {
              <div class="alert d-flex align-items-center gap-2 py-2.5 px-3 rounded-3 mb-3 small" 
                   [ngClass]="message.includes('successful') ? 'alert-success' : 'alert-danger'" role="alert">
                <i class="bi" [ngClass]="message.includes('successful') ? 'bi-check-circle-fill text-success' : 'bi-exclamation-triangle-fill text-danger'"></i>
                <div>{{ message }}</div>
              </div>
            }

            <form (ngSubmit)="register()">
              
              <div class="mb-3">
                <label class="form-label" for="username">Full Name</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person text-secondary"></i></span>
                  <input 
                    type="text" 
                    id="username"
                    name="name" 
                    [(ngModel)]="registerData.name" 
                    class="form-control" 
                    placeholder="e.g. John Doe" 
                    required>
                </div>
              </div>
              
              <div class="mb-3">
                <label class="form-label" for="email">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope text-secondary"></i></span>
                  <input 
                    type="email" 
                    id="email"
                    name="email" 
                    [(ngModel)]="registerData.email" 
                    class="form-control" 
                    placeholder="name@gmail.com" 
                    required>
                </div>
                <span class="text-muted" style="font-size: 0.78rem;">Must be a valid @gmail.com email</span>
              </div>
             
              <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock text-secondary"></i></span>
                  <input 
                    type="password" 
                    id="password"
                    name="password" 
                    [(ngModel)]="registerData.password" 
                    class="form-control" 
                    placeholder="Min 6 chars &amp; 1 special char" 
                    required>
                </div>
              </div>
              
              <div class="mb-3">
                <label class="form-label" for="phone">Phone Number</label>
                <div class="input-group">
                  <select 
                    class="form-select country-code-select flex-shrink-0" 
                    name="countryCode" 
                    [(ngModel)]="selectedCountryCode"
                    style="max-width: 140px; border-top-right-radius: 0; border-bottom-right-radius: 0;">
                    @for (c of countryCodes; track c.code) {
                      <option [value]="c.code">{{ c.flag }} {{ c.code }}</option>
                    }
                  </select>
                  
                  <input 
                    type="text" 
                    id="phone"
                    name="phone" 
                    [(ngModel)]="registerData.phone" 
                    class="form-control" 
                    placeholder="10-digit mobile number" 
                    minlength="10" 
                    maxlength="10" 
                    required
                    style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                </div>
              </div>
              
              <div class="mb-4">
                <label class="form-label" for="role">Register As</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person-badge text-secondary"></i></span>
                  <select name="role" id="role" [(ngModel)]="registerData.role" class="form-select">
                    <option value="user">Passenger (Book rides across city)</option>
                    <option value="driver">Driver (Accept trips &amp; earn)</option>
                  </select>
                </div>
              </div>

              @if (registerData.role === 'driver') {
                <div class="driver-card p-3.5 mb-4 rounded-3 animate-fade-in-up">
                  <div class="d-flex align-items-center gap-2 mb-3 pb-2 border-bottom border-warning">
                    <i class="bi bi-car-front-fill text-yellow fs-5"></i>
                    <h6 class="mb-0 fw-bold text-navy">Driver &amp; Vehicle Registration</h6>
                  </div>
                  
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label" for="licensenumber">License Number</label>
                      <input 
                        type="number" 
                        id="licensenumber"
                        name="licensenumber" 
                        [(ngModel)]="registerData.licensenumber" 
                        class="form-control" 
                        placeholder="e.g. 1029384" 
                        required>
                    </div>

                    <div class="col-md-6">
                      <label class="form-label" for="vehicleType">Vehicle Type</label>
                      <select name="vehicleType" id="vehicleType" [(ngModel)]="registerData.vehicleType" class="form-select">
                        <option value="Sedan">Sedan (Standard 4-seater)</option>
                        <option value="SUV">SUV (Spacious 6-seater)</option>
                        <option value="Hatchback">Hatchback (Compact 4-seater)</option>
                      </select>
                    </div>

                    <div class="col-md-6">
                      <label class="form-label" for="numberplate">Vehicle Plate Number</label>
                      <input 
                        type="text" 
                        id="numberplate"
                        name="numberplate" 
                        [(ngModel)]="registerData.numberplate" 
                        class="form-control text-uppercase" 
                        placeholder="e.g. TN01AB1234" 
                        required>
                    </div>

                    <div class="col-md-6">
                      <label class="form-label" for="capacity">Seating Capacity</label>
                      <input 
                        type="number" 
                        id="capacity"
                        name="capacity" 
                        [(ngModel)]="registerData.capacity" 
                        class="form-control" 
                        placeholder="e.g. 4" 
                        min="1" 
                        max="8"
                        required>
                    </div>
                  </div>
                </div>
              }

              <button 
                type="submit" 
                class="btn btn-swift-yellow w-100 py-2.5 fw-bold mb-3 shadow-sm"
                [disabled]="loading">
                @if (loading) {
                  <span class="spinner-border spinner-border-sm me-2" role="status"></span> Registering...
                } @else {
                  <i class="bi bi-person-plus-fill me-1"></i> Register Account
                }
              </button>
              
              <div class="text-center pt-2 border-top">
                <p class="small text-secondary mb-0">
                  Already registered with SwiftCab? 
                  <a routerLink="/login" class="text-navy fw-bold text-decoration-none hover-yellow ms-1">Sign In here</a>
                </p>
              </div>
            </form>
          </div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>

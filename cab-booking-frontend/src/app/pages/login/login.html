<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="auth-wrapper d-flex align-items-center justify-content-center py-5">
    <div class="container px-3">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
          
          <div class="card swift-card p-4 p-sm-5 animate-fade-in-up">
            
            <div class="text-center mb-4">
              <div class="auth-icon-bubble mx-auto mb-3">
                <i class="bi bi-taxi-front-fill text-yellow fs-2"></i>
              </div>
              @if (!isForgotPasswordMode) {
                <h3 class="fw-bold text-navy mb-1">Welcome Back</h3>
                <p class="text-secondary small mb-0">Sign in to manage your rides and bookings</p>
              } @else {
                <h3 class="fw-bold text-navy mb-1">Reset Password</h3>
                <p class="text-secondary small mb-0">Verify your registered details to reset credentials</p>
              }
            </div>

            @if (message) {
              <div class="alert d-flex align-items-center gap-2 py-2.5 px-3 rounded-3 mb-3 small" 
                   [ngClass]="message.includes('success') ? 'alert-success' : 'alert-danger'" role="alert">
                <i class="bi" [ngClass]="message.includes('success') ? 'bi-check-circle-fill text-success' : 'bi-exclamation-triangle-fill text-danger'"></i>
                <div>{{ message }}</div>
              </div>
            }

            @if (!isForgotPasswordMode) {
              <form (ngSubmit)="login()">
                <div class="mb-3">
                  <label class="form-label" for="email">Email Address</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope text-secondary"></i></span>
                    <input 
                      type="email" 
                      id="email"
                      name="email" 
                      [(ngModel)]="loginData.email" 
                      class="form-control" 
                      placeholder="name@example.com" 
                      required>
                  </div>
                </div>
                
                <div class="mb-4">
                  <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label mb-0" for="password">Password</label>
                    <button type="button" (click)="toggleForgotPassword(true)" class="btn btn-link p-0 text-navy small fw-semibold text-decoration-none hover-yellow">
                      Forgot Password?
                    </button>
                  </div>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock text-secondary"></i></span>
                    <input 
                      type="password" 
                      id="password"
                      name="password" 
                      [(ngModel)]="loginData.password" 
                      class="form-control" 
                      placeholder="Enter password" 
                      required>
                  </div>
                </div>

                <button type="submit" class="btn btn-swift-yellow w-100 py-2.5 fw-bold mb-3 shadow-sm">
                  <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
                
                <div class="text-center pt-2 border-top">
                  <p class="small text-secondary mb-0">
                    Don't have an account? 
                    <a routerLink="/register" class="text-navy fw-bold text-decoration-none hover-yellow ms-1">Create Account</a>
                  </p>
                </div>
              </form>
            } @else {
              <form (ngSubmit)="resetPassword()">
                <div class="mb-3">
                  <label class="form-label" for="resetEmail">Email Address</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope text-secondary"></i></span>
                    <input 
                      type="email" 
                      id="resetEmail"
                      name="resetEmail" 
                      [(ngModel)]="forgotPasswordData.email" 
                      class="form-control" 
                      placeholder="name@example.com" 
                      required>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="resetPhone">Phone Number</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-telephone text-secondary"></i></span>
                    <input 
                      type="text" 
                      id="resetPhone"
                      name="resetPhone" 
                      [(ngModel)]="forgotPasswordData.phone" 
                      class="form-control" 
                      placeholder="10-digit phone number" 
                      minlength="10" 
                      maxlength="10" 
                      required>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="newPassword">New Password</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-lock text-secondary"></i></span>
                    <input 
                      type="password" 
                      id="newPassword"
                      name="newPassword" 
                      [(ngModel)]="forgotPasswordData.newPassword" 
                      class="form-control" 
                      placeholder="Min 6 chars &amp; 1 special char" 
                      required>
                  </div>
                </div>

                <div class="mb-4">
                  <label class="form-label" for="confirmPassword">Confirm New Password</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill text-secondary"></i></span>
                    <input 
                      type="password" 
                      id="confirmPassword"
                      name="confirmPassword" 
                      [(ngModel)]="forgotPasswordData.confirmPassword" 
                      class="form-control" 
                      placeholder="Confirm new password" 
                      required>
                  </div>
                </div>

                <button type="submit" class="btn btn-swift-yellow w-100 py-2.5 fw-bold mb-3 shadow-sm">
                  <i class="bi bi-check2-circle me-1"></i> Update Password
                </button>
                
                <div class="text-center pt-2 border-top">
                  <button type="button" (click)="toggleForgotPassword(false)" class="btn btn-link text-navy small fw-semibold text-decoration-none hover-yellow">
                    <i class="bi bi-arrow-left me-1"></i> Back to Sign In
                  </button>
                </div>
              </form>
            }

          </div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>

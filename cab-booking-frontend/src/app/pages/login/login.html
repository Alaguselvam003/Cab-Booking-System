<div class="auth-container d-flex justify-content-center align-items-center">
  <div class="card auth-card shadow-sm p-4 col-12 col-sm-10 col-md-8 col-lg-6">
    <div class="text-center mb-4">
      <h2 class="text-primary font-weight-bold">Welcome Back</h2>
      <p class="text-muted">Login to request a ride or manage trips</p>
    </div>

    @if (message) {
      <div class="alert alert-info text-center py-2" role="alert">
        {{ message }}
      </div>
    }

    <form (ngSubmit)="login()">
      
      <div class="mb-3">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-primary"><i class="bi bi-envelope"></i></span>
          <input type="email" name="email" [(ngModel)]="loginData.email" class="form-control" placeholder="Enter email" required>
        </div>
      </div>
      
     
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-primary"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" [(ngModel)]="loginData.password" class="form-control" placeholder="Enter password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 mb-3 shadow-sm">Login</button>
      
      <div class="text-center text-muted">
        <p class="mb-0">Don't have an account? <a routerLink="/register" class="text-primary text-decoration-none fw-bold">Register here</a></p>
      </div>
    </form>
  </div>
</div>

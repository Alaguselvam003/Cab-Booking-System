<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3 shadow-sm fixed-top">
  <div class="container px-4">
    <a class="navbar-brand fw-bold text-primary fs-4 d-flex align-items-center" routerLink="/">
      <i class="bi bi-send-fill text-primary me-2"></i>SwiftCab
    </a>
    
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#swiftCabNavbar" aria-controls="swiftCabNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="swiftCabNavbar">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
        <li class="nav-item">
          <a class="nav-link px-3 fw-semibold text-dark" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
        </li>
        @if (isLoggedIn()) {
          <li class="nav-item">
            @if (getCurrentUser()?.role === 'driver') {
              <a class="nav-link px-3 fw-semibold text-dark" routerLink="/driver/dashboard" routerLinkActive="active">Driver Portal</a>
            } @else {
              <a class="nav-link px-3 fw-semibold text-dark" routerLink="/passenger/dashboard" routerLinkActive="active">Passenger Portal</a>
            }
          </li>
        }
      </ul>
      
      <div class="d-flex align-items-center gap-3">
        @if (!isLoggedIn()) {
          <a routerLink="/login" class="btn btn-outline-primary fw-semibold px-3 py-2">Sign In</a>
          <a routerLink="/register" class="btn btn-primary fw-bold px-4 py-2 shadow-sm">Sign Up</a>
        } @else {
          <span class="text-muted small">Welcome, <strong class="text-dark">{{ getCurrentUser()?.name }}</strong></span>
          <button (click)="logout()" class="btn btn-outline-danger btn-sm px-3 py-2 fw-semibold">
            <i class="bi bi-box-arrow-right me-1"></i>Logout
          </button>
        }
      </div>
    </div>
  </div>
</nav>
